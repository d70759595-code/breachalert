name: BreachAlert CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: breachalert
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Security Tests
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/breachalert
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_ci
        run: npx jest server.test.js --forceExit

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Build React Frontend
        run: |
          cd client
          npm run build
